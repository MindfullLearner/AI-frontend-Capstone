<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThinkLens — Decision Setup</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="site-eyebrow">ThinkLens</p>
      <h1>Decision Setup</h1>
      <p class="site-tagline">Organize your decision before AI analysis.</p>
    </div>
  </header>

  <main class="container">
    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading" class="visually-hidden">Decision setup form</h2>

      <form id="decision-form" novalidate>
        <div class="field-group">
          <label for="decision-title">Decision title</label>
          <input
            type="text"
            id="decision-title"
            name="title"
            required
            minlength="5"
            autocomplete="off"
            aria-describedby="title-error"
          >
          <p id="title-error" class="field-error" role="alert" hidden></p>
        </div>

        <div class="field-group">
          <label for="decision-context">Decision context</label>
          <textarea
            id="decision-context"
            name="context"
            rows="4"
            required
            minlength="20"
            aria-describedby="context-error"
          ></textarea>
          <p id="context-error" class="field-error" role="alert" hidden></p>
        </div>

        <div class="field-group">
          <label for="decision-category">Category</label>
          <select id="decision-category" name="category" required aria-describedby="category-error">
            <option value="">Select a category</option>
            <option value="Career">Career</option>
            <option value="Education">Education</option>
            <option value="Finance">Finance</option>
            <option value="Personal">Personal</option>
            <option value="Other">Other</option>
          </select>
          <p id="category-error" class="field-error" role="alert" hidden></p>
        </div>

        <fieldset class="dynamic-fieldset" id="options-fieldset">
          <legend>Options</legend>
          <p class="fieldset-help">Add at least two options you are considering.</p>
          <div id="options-list" class="dynamic-list"></div>
          <p id="options-error" class="field-error" role="alert" hidden></p>
          <button type="button" id="add-option-btn" class="btn btn-secondary">Add option</button>
        </fieldset>

        <fieldset class="dynamic-fieldset" id="criteria-fieldset">
          <legend>Evaluation criteria</legend>
          <p class="fieldset-help">Add criteria with a weight from 1 (low) to 5 (high).</p>
          <div id="criteria-list" class="dynamic-list"></div>
          <p id="criteria-error" class="field-error" role="alert" hidden></p>
          <button type="button" id="add-criterion-btn" class="btn btn-secondary">Add criterion</button>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save decision setup</button>
        </div>
      </form>
    </section>

    <section
      id="summary-section"
      class="summary-section"
      aria-labelledby="summary-heading"
      hidden
    >
      <h2 id="summary-heading">Decision summary</h2>
      <p class="summary-intro">Your decision setup is ready for future AI analysis.</p>
      <div id="summary-content" class="summary-content"></div>
      <button type="button" id="edit-decision-btn" class="btn btn-secondary">Edit decision</button>
    </section>
  </main>

  <script src="js/decision-setup.js"></script>
</body>
</html>
